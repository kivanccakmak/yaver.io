name: Legacy Desktop Release (disabled)

# `desktop/installer` was a second Electron product with its own auth, task
# store, updater, version, and unsigned release lane. It is intentionally not
# publishable. The canonical application is `electron/` and releases only via
# release-gui.yml (`gui/v*`). Keeping this manual tombstone makes an old
# bookmark or attempted workflow run fail loudly instead of resurrecting the
# stale installer.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "desktop/installer is retired and must not be released." >&2
          echo "Use ./deploy/deploy.sh desktop and the gui/v* release-gui.yml lane." >&2
          exit 1
