name: tmp-export-play-key
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export service account
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > /tmp/play-sa.json
          echo "wrote $(wc -c < /tmp/play-sa.json) bytes"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-sa
          path: /tmp/play-sa.json
          retention-days: 1
