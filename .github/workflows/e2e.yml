name: E2E

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "e2e/**"
      - "backend/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "e2e/**"
      - "backend/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      - name: Install web deps
        run: cd web && npm ci

      - name: Install e2e deps
        run: cd e2e && npm install

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: cd e2e && npx playwright install-deps chromium

      - name: Probe password-auth E2E capability
        id: password-auth
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const base = process.env.E2E_CONVEX_URL || process.env.NEXT_PUBLIC_CONVEX_SITE_URL || "https://perceptive-minnow-557.eu-west-1.convex.site";
          const id = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
          const user = {
            email: `e2e-probe-${id}@yaver.test`,
            password: `pw-${id}A1`,
            fullName: `E2E Probe ${id.slice(0, 8)}`,
          };
          const res = await fetch(`${base}/auth/signup`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(user),
          });
          if (!res.ok) {
            const body = await res.text();
            console.error(`[e2e password-auth probe] signup unavailable: ${res.status} ${body}`);
            console.log("enabled=false");
            console.log("reason=password-signup-unavailable");
            process.exit(0);
          }
          const data = await res.json().catch(() => ({}));
          if (data.token) {
            await fetch(`${base}/auth/delete-account`, {
              method: "POST",
              headers: { Authorization: `Bearer ${data.token}` },
            }).catch(() => {});
          }
          console.log("enabled=true");
          console.log("reason=");
          NODE

      - name: Run Playwright suite
        run: |
          set -euo pipefail
          if [ "${{ steps.password-auth.outputs.enabled }}" = "true" ]; then
            cd e2e
            npx playwright test
          else
            echo "::warning::Skipping password-auth E2E specs because live signup is unavailable: ${{ steps.password-auth.outputs.reason }}"
            cd e2e
            E2E_SKIP_LIVE_AUTH=1 npx playwright test \
              tests/dashboard-autodev.spec.ts \
              tests/landing.spec.ts \
              tests/managed-cloud-delete.spec.ts \
              tests/mobile-app-lane-matrix.spec.ts \
              tests/remote-preview-live.spec.ts \
              tests/remote-runners.spec.ts \
              tests/webrtc-stream-live.spec.ts \
              tests/webui-lane-matrix.spec.ts
          fi
        env:
          CI: "1"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 14
          if-no-files-found: ignore
