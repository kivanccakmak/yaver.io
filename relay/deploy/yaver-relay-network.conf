# Raise ceilings so quic-go can request its 7 MiB UDP buffers. These are
# maxima, not per-socket reservations, so they do not preallocate 15 MB for
# every connection on a 4 GB relay host.
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000

# Absorb short QUIC/TURN packet bursts while the two vCPUs are scheduled.
# Keep this modest: the bounded services and 4 GB host do not need a huge
# global ingress queue.
net.core.netdev_max_backlog = 4096
