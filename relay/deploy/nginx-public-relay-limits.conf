limit_req_zone $binary_remote_addr zone=yaver_relay_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=yaver_relay_connections:10m;

# Deliberately omit the request URI because it contains the device identifier.
log_format yaver_relay '$remote_addr - $time_iso8601 "$request_method" '
                       '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time';
