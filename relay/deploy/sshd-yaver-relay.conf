# Operations access for a public relay. Keep root key login available for
# recovery, but remove every password and forwarding path the relay does not
# use. Validate with `sshd -t` before reload and always retain a live recovery
# session until a fresh key login succeeds.
PermitRootLogin prohibit-password
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
GatewayPorts no
PermitTunnel no

MaxAuthTries 3
LoginGraceTime 30
MaxStartups 10:30:30
ClientAliveInterval 120
ClientAliveCountMax 2
UseDNS no
LogLevel VERBOSE
