# feature-shortcut-id — /shortcut/[id]: "Open this shortcut in the Yaver app."
# handoff page for a mobile shortcut deep link. A bogus id still renders the
# handoff card. Name carries the bracketed segment so the coverage ledger sees
# the dynamic route as covered.
name: "feature-shortcut-[id]"
target: web
url: http://127.0.0.1:3000
viewport: { width: 1366, height: 900 }
timeout_ms: 15000

artifacts:
  on: always
  screenshot: true
  video: true

capture:
  console_errors: true
  network: true

steps:
  - goto: /shortcut/abc123
  - wait_for: h1
  - assert.text: Open this shortcut in the Yaver app.
  - screenshot: true
