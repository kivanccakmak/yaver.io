# feature-render — /render: "Open this render in the Yaver app." handoff page.
name: feature-render
target: web
url: http://127.0.0.1:3000
viewport: { width: 1366, height: 900 }
timeout_ms: 15000

artifacts:
  on: always
  screenshot: true
  video: true

capture:
  console_errors: true
  network: true

steps:
  - goto: /render
  - wait_for: h1
  - assert.text: Open this render in the Yaver app.
  - assert.text: Yaver render
  - screenshot: true
