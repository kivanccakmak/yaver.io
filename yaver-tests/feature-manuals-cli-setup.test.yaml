# feature-manuals-cli-setup — manual: CLI setup & usage guide.
name: feature-manuals-cli-setup
target: web
url: http://127.0.0.1:3000
viewport: { width: 1366, height: 900 }
timeout_ms: 15000

artifacts:
  on: always
  screenshot: true
  video: true

capture:
  console_errors: true
  network: true

steps:
  - goto: /manuals/cli-setup
  - wait_for: h1
  - assert.text: CLI setup
  - assert.text: usage guide
  - screenshot: true
