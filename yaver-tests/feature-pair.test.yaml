# feature-pair — /pair: pairing/deep-link page. Without a ?code payload it
# deterministically renders the "Yaver Pairing" intro (SSR'd).
name: feature-pair
target: web
url: http://127.0.0.1:3000
viewport: { width: 1366, height: 900 }
timeout_ms: 15000

artifacts:
  on: always
  screenshot: true
  video: true

capture:
  console_errors: true
  network: true

steps:
  - goto: /pair
  - wait_for: h1
  - assert.text: Yaver Pairing
  - screenshot: true
