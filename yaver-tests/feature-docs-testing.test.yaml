# feature-docs-testing — developer docs page /docs/testing (Test Suite).
name: feature-docs-testing
target: web
url: http://127.0.0.1:3000
viewport: { width: 1366, height: 900 }
timeout_ms: 15000

artifacts:
  on: always
  screenshot: true
  video: true

capture:
  console_errors: true
  network: true

steps:
  - goto: /docs/testing
  - wait_for: h1
  - assert.text: Test Suite
  - screenshot: true
