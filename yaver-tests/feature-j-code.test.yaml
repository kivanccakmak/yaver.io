# feature-j-code — /j/[code]: support-invite join link page. A bogus code
# fails the Convex invite lookup and deterministically renders the
# "Link expired" state. Name carries the bracketed segment for ledger coverage.
name: "feature-j-[code]"
target: web
url: http://127.0.0.1:3000
viewport: { width: 1366, height: 900 }
timeout_ms: 20000

artifacts:
  on: always
  screenshot: true
  video: true

capture:
  console_errors: true
  network: true

steps:
  - goto: /j/abc123
  - wait_for: h1
  - assert.text: Link expired
  - assert.text: Ask the person who sent it for a fresh link
  - screenshot: true
