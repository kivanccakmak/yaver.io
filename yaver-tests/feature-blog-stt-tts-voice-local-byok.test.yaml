# feature-blog-stt-tts-voice-local-byok — blog post: local STT/TTS by default,
# BYO cloud keys kept in the vault. SSR'd h1 carries the post title.
name: feature-blog-stt-tts-voice-local-byok
target: web
url: http://127.0.0.1:3000
viewport: { width: 1366, height: 900 }
timeout_ms: 15000

artifacts:
  on: always
  screenshot: true
  video: true

capture:
  console_errors: true
  network: true

steps:
  - goto: /blog/stt-tts-voice-local-byok
  - wait_for: h1
  - assert.text: local STT/TTS by default
  - assert.text: Voice in Yaver
  - screenshot: true
