# feature-manuals-code-from-beach — manual: remote build, test & deploy.
name: feature-manuals-code-from-beach
target: web
url: http://127.0.0.1:3000
viewport: { width: 1366, height: 900 }
timeout_ms: 15000

artifacts:
  on: always
  screenshot: true
  video: true

capture:
  console_errors: true
  network: true

steps:
  - goto: /manuals/code-from-beach
  - wait_for: h1
  - assert.text: Code from the Beach
  - assert.text: Remote Build, Test
  - screenshot: true
