# feature-manuals-auto-boot — manual: headless dev machine set up once.
name: feature-manuals-auto-boot
target: web
url: http://127.0.0.1:3000
viewport: { width: 1366, height: 900 }
timeout_ms: 15000

artifacts:
  on: always
  screenshot: true
  video: true

capture:
  console_errors: true
  network: true

steps:
  - goto: /manuals/auto-boot
  - wait_for: h1
  - assert.text: Headless Dev Machine
  - assert.text: Set Up Once, Code Forever
  - screenshot: true
